<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; background:#0c0c0d; }
  *{ box-sizing:border-box; }
  body{ -webkit-font-smoothing:antialiased; }
  a{ color:#f4f4f3; }
  a:hover{ color:#ffffff; }
  @media (max-width:900px){ .hero-book{ display:none !important; } }
  @font-face{ font-family:'Shlapak Script'; src:url('assets/shlapak-script.otf') format('opentype'); font-weight:400; font-display:swap; }
  @media (max-width:640px){ .sig{ position:static !important; display:block !important; text-align:center !important; transform:none !important; font-size:0.38em !important; margin-top:-0.04em !important; } }
  @keyframes cueMove{ 0%{ top:-100%; } 60%{ top:100%; } 100%{ top:100%; } }
  @media (prefers-reduced-motion: reduce){ .cue-fill{ animation:none !important; top:0 !important; } }
  @media (max-width:860px){ .hero-nav-links{ display:none !important; } }
  @media (max-width:640px){ .hero-brand-word{ display:none !important; } .hero-cue{ display:none !important; } .hero-video{ object-position:58% 42% !important; } }
</style>
</helmet>

<section id="hero" data-screen-label="Первый экран" style="position:relative; min-height:100svh; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; background:#0c0c0d; isolation:isolate; font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif; line-height:1.6; color:#f4f4f3;">

  <video class="hero-video" ref="{{ videoRef }}" src="assets/hero.mp4" poster="assets/hero-frame.png" autoPlay="{{ true }}" muted="{{ true }}" loop="{{ true }}" playsInline="{{ true }}" preload="auto" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 42%; z-index:0;"></video>
  <div style="position:absolute; inset:0 0 auto 0; height:38%; z-index:1; background:linear-gradient(to bottom, rgba(8,8,9,0.62), rgba(8,8,9,0));"></div>
  <div style="position:absolute; inset:auto 0 0 0; height:64%; z-index:1; background:linear-gradient(to top, rgba(6,6,7,0.74) 0%, rgba(6,6,7,0.5) 38%, rgba(6,6,7,0) 100%);"></div>

  <div style="position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:24px clamp(20px,4vw,56px) 0;">
    <div style="display:flex; align-items:center; gap:11px; flex-shrink:0;">
      <span style="width:30px; height:30px; border-radius:50%; border:1px solid rgba(244,244,243,0.4); overflow:hidden; flex-shrink:0; background:rgba(244,244,243,0.06); display:block;"><img src="assets/brand-mark.jpg" alt="Логотип Филиппа Помазкова" style="width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(1) contrast(1.05);"></span>
      <span class="hero-brand-word" style="font-family:'Source Serif 4',Georgia,serif; font-weight:600; font-size:15px; letter-spacing:0.02em; color:#f4f4f3;">Filipp Pomazkov</span>
    </div>
    <nav style="display:flex; align-items:center; gap:30px;">
      <div class="hero-nav-links" style="display:flex; align-items:center; gap:26px;">
        <a href="#results" style="font-size:13px; font-weight:500; letter-spacing:0.01em; color:#c9c9c8; text-decoration:none; white-space:nowrap; transition:color .15s ease;" style-hover="color:#f4f4f3">Результаты</a>
        <a href="#directions" style="font-size:13px; font-weight:500; letter-spacing:0.01em; color:#c9c9c8; text-decoration:none; white-space:nowrap; transition:color .15s ease;" style-hover="color:#f4f4f3">Направления</a>
        <a href="#cases" style="font-size:13px; font-weight:500; letter-spacing:0.01em; color:#c9c9c8; text-decoration:none; white-space:nowrap; transition:color .15s ease;" style-hover="color:#f4f4f3">Кейсы</a>
        <a href="#approach" style="font-size:13px; font-weight:500; letter-spacing:0.01em; color:#c9c9c8; text-decoration:none; white-space:nowrap; transition:color .15s ease;" style-hover="color:#f4f4f3">Подход</a>
        <a href="#contacts" style="font-size:13px; font-weight:500; letter-spacing:0.01em; color:#c9c9c8; text-decoration:none; white-space:nowrap; transition:color .15s ease;" style-hover="color:#f4f4f3">Контакты</a>
      </div>
      <a class="hero-book" href="#booking" style="font-size:13px; font-weight:500; letter-spacing:0.03em; color:#f4f4f3; text-decoration:none; border:1px solid rgba(244,244,243,0.4); padding:9px 18px; border-radius:2px; white-space:nowrap; transition:border-color .15s ease;" style-hover="border-color:rgba(244,244,243,0.85)">Записаться</a>
    </nav>
  </div>

  <div style="position:relative; z-index:2; padding:0 clamp(20px,4vw,56px) clamp(30px,5vw,54px); display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;">
    <div style="font-family:'IBM Plex Mono',monospace; font-size:13.6px; letter-spacing:0.16em; text-transform:uppercase; color:#c9c9c8; display:flex; align-items:center; gap:12px;">
      <i style="width:22px; height:1px; background:rgba(244,244,243,0.4); display:block; flex-shrink:0;"></i>
      Пластический хирург · Санкт‑Петербург
      <i style="width:22px; height:1px; background:rgba(244,244,243,0.4); display:block; flex-shrink:0;"></i>
    </div>
    <div style="position:relative; margin:2px 0 32px; font-family:'Source Serif 4',Georgia,serif; font-weight:700; font-size:clamp(52px,11vw,148px); line-height:0.94; letter-spacing:0.01em; color:#f4f4f3; text-transform:uppercase; text-wrap:balance;">Pomazkov<span class="sig" style="position:absolute; left:58%; bottom:-0.17em; font-family:'Shlapak Script',cursive; font-weight:400; font-size:0.33em; line-height:1; letter-spacing:0.01em; color:#f7f5f1; text-transform:none; white-space:nowrap; transform:rotate(-2deg); transform-origin:left center; pointer-events:none;">естественный результат</span></div>

    <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 16px; margin-top:22px;">
      <a href="#booking" style="font-size:13.5px; font-weight:500; letter-spacing:0.01em; padding:13px 24px; border-radius:2px; text-decoration:none; display:inline-flex; align-items:center; gap:8px; background:#f4f4f3; color:#141415; border:1px solid transparent; white-space:nowrap; transition:opacity .15s ease;" style-hover="opacity:0.86">Обсудить мой случай</a>
      <a href="#results" style="font-size:13.5px; font-weight:500; letter-spacing:0.01em; padding:13px 24px; border-radius:2px; text-decoration:none; display:inline-flex; align-items:center; gap:8px; background:transparent; color:#f4f4f3; border:1px solid rgba(244,244,243,0.38); white-space:nowrap; transition:border-color .15s ease;" style-hover="border-color:rgba(244,244,243,0.8)">Смотреть результаты</a>
    </div>
    <div style="display:none;">
      <a href="#directions" style="font-size:13px; font-weight:500; letter-spacing:0.01em; color:#c9c9c8; text-decoration:none; border-bottom:1px solid rgba(244,244,243,0.28); padding-bottom:1px; transition:color .15s ease, border-color .15s ease;" style-hover="color:#f4f4f3; border-color:rgba(244,244,243,0.6)">Выбрать направление →</a>
    </div>
  </div>

  <div class="hero-cue" style="position:absolute; z-index:2; right:clamp(20px,4vw,56px); bottom:clamp(28px,4.5vw,48px); display:flex; flex-direction:column; align-items:center; gap:8px;">
    <span style="font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#c9c9c8; writing-mode:vertical-rl;">Листайте</span>
    <i style="width:1px; height:34px; background:rgba(244,244,243,0.4); position:relative; overflow:hidden; display:block;"><i class="cue-fill" style="content:''; position:absolute; left:0; top:-100%; width:100%; height:100%; background:#f4f4f3; animation:cueMove 2.2s ease-in-out infinite; display:block;"></i></i>
  </div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  videoRef = React.createRef();
  componentDidMount() {
    const start = () => {
      const v = this.videoRef.current;
      if (!v) return;
      v.muted = true;
      v.playsInline = true;
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    };
    start();
    this._retry = setInterval(start, 800);
    this._onTouch = () => start();
    document.addEventListener('pointerdown', this._onTouch, { once: true });
    setTimeout(() => clearInterval(this._retry), 6000);
  }
  componentWillUnmount() {
    clearInterval(this._retry);
    document.removeEventListener('pointerdown', this._onTouch);
  }
  renderVals() {
    return { videoRef: this.videoRef };
  }
}
</script>
</body>
</html>
