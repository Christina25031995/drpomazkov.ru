<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  .mq-wrap{ display:none; }
  @media (max-width:900px){ .mq-wrap{ display:block; } }
  .mq-rail{ display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .mq-rail::-webkit-scrollbar{ display:none; }
  .mq-slide{ flex:0 0 100%; scroll-snap-align:start; position:relative; }
  .mq-wrap{ padding:0 !important; margin:0 !important; }
  .mq-wrap img{ display:block; width:100%; height:100%; }
</style>
</helmet>

<section class="mq-wrap" data-screen-label="Мобильный запрос" style="position:relative; background:#0c0c0d; color:#f4f4f3; font-family:'IBM Plex Sans',-apple-system,sans-serif; overflow:hidden;">

  <div style="position:absolute; left:20px; right:20px; top:24px; z-index:5; display:flex; align-items:baseline; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:rgba(244,244,243,0.72);">
    <span>Ваш запрос</span>
    <span style="color:rgba(244,244,243,0.55);">Свайп →</span>
  </div>

  <div class="mq-rail" onScroll="{{ onScroll }}" style="height:100svh;">
    <sc-for list="{{ slides }}" as="s" hint-placeholder-count="6">
      <div class="mq-slide" style="height:100svh; overflow:hidden;">
        <sc-if value="{{ s.img }}" hint-placeholder-val="{{ true }}">
          <img src="{{ s.img }}" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:{{ s.pos }}; display:block;">
        </sc-if>
        <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(12,12,13,0.72) 0%, rgba(12,12,13,0.15) 34%, rgba(12,12,13,0.55) 70%, #0c0c0d 100%);"></div>
        <div style="position:absolute; left:20px; right:20px; bottom:126px; z-index:3;">
          <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; color:rgba(244,244,243,0.72);">{{ s.index }}</div>
          <div style="margin-top:10px; font-weight:600; text-transform:uppercase; font-size:28px; hyphens:none; overflow-wrap:normal; line-height:1.04; letter-spacing:-0.01em; text-wrap:balance;">{{ s.title }}</div>
          <div style="margin-top:12px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(244,244,243,0.7);">{{ s.proc }}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position:absolute; left:20px; right:20px; bottom:100px; z-index:5; display:flex; gap:6px;">
    <sc-for list="{{ bars }}" as="b" hint-placeholder-count="6">
      <i style="flex:1; height:2px; display:block; background:{{ b.bg }};"></i>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:414,&quot;height&quot;:860}}">
class Component extends DCLogic {
  state = { i: 0 };
  renderVals(){
    const data = [
      { img:'assets/img-gaze.jpg',  pos:'50% 34%', title:'Хочу более открытый взгляд', proc:'Блефаропластика' },
      { img:'assets/img-chest.jpg', pos:'46% 42%', title:'Хочу изменить грудь', proc:'Маммопластика' },
      { img:'assets/img-waist.jpg', pos:'42% 52%', title:'Хочу вернуть форму живота после родов', proc:'Абдоминопластика' },
      { img:null,                   pos:'50% 50%', title:'Хочу скорректировать контуры тела', proc:'Липосакция' },
      { img:'assets/img-back.jpg',  pos:'27% 46%', title:'Хочу подчеркнуть форму тела', proc:'Липоскульптурирование' },
      { img:'assets/img-jaw.jpg',   pos:'38% 46%', title:'Хочу омолодить лицо, но остаться собой', proc:'Подтяжка лица' }
    ];
    const i = this.state.i;
    return {
      slides: data.map((d, n) => ({ ...d, index: String(n+1).padStart(2,'0') + ' / 06' })),
      bars: data.map((_, n) => ({ bg: n === i ? '#f4f4f3' : 'rgba(244,244,243,0.22)' })),
      onScroll: (e) => {
        const el = e.currentTarget;
        const n = Math.round(el.scrollLeft / el.clientWidth);
        if (n !== this.state.i) this.setState({ i: n });
      }
    };
  }
}
</script>
</body>
</html>
