<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; background:#101011; }
  *{ box-sizing:border-box; }
  body{ -webkit-font-smoothing:antialiased; hyphens:none; }
  a{ color:#f4f4f3; text-decoration:none; }
  a:hover{ color:#ffffff; }
  @media (max-width:900px){
    #explains{ padding:40px 20px 96px !important; min-height:auto !important; }
    #explains button span:last-child{ font-size:17px !important; }
    #explains h3{ white-space:normal !important; font-size:21px !important; }
    #explains button{ min-height:52px; }
  }
  @media (max-width:960px){
    .ex-grid{ grid-template-columns:minmax(0,1fr) !important; gap:clamp(22px,4vh,38px) !important; }
    .ex-preview{ height:44vh !important; }
  }
</style>
</helmet>

<section id="explains" data-screen-label="Филипп объясняет" style="position:relative; background:#101011; color:#f4f4f3; font-family:'IBM Plex Sans',-apple-system,sans-serif; min-height:70vh; padding:clamp(44px,7vh,88px) clamp(22px,5vw,72px) clamp(44px,6.5vh,84px);">

  <div style="display:flex; align-items:baseline; justify-content:space-between; gap:24px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(244,244,243,0.76);">
    <div style="white-space:nowrap;">Филипп объясняет</div>
  </div>
  <div style="height:1px; background:rgba(244,244,243,0.16); margin-top:14px;"></div>

  <div class="ex-grid" style="margin-top:clamp(26px,4.4vh,58px); display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:clamp(26px,5vw,96px); align-items:start;">

    <div>
      <div style="border-top:1px solid rgba(244,244,243,0.14);">
        <button type="button" onClick="{{ sel0 }}" style="width:100%; text-align:left; background:none; border:0; border-bottom:1px solid rgba(244,244,243,0.1); padding:clamp(13px,1.9vh,20px) 0; display:grid; grid-template-columns:44px minmax(0,1fr); gap:16px; align-items:baseline; cursor:pointer; color:inherit; font:inherit;">
          <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; color:{{ c0 }};">01</span>
          <span style="font-family:'Source Serif 4',Georgia,serif; font-weight:600; text-transform:uppercase; font-size:clamp(15px,1.35vw,23px); line-height:1.16; color:{{ t0 }};">Что я оцениваю на первой консультации</span>
        </button>
        <button type="button" onClick="{{ sel1 }}" style="width:100%; text-align:left; background:none; border:0; border-bottom:1px solid rgba(244,244,243,0.1); padding:clamp(13px,1.9vh,20px) 0; display:grid; grid-template-columns:44px minmax(0,1fr); gap:16px; align-items:baseline; cursor:pointer; color:inherit; font:inherit;">
          <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; color:{{ c1 }};">02</span>
          <span style="font-family:'Source Serif 4',Georgia,serif; font-weight:600; text-transform:uppercase; font-size:clamp(15px,1.35vw,23px); line-height:1.16; color:{{ t1 }};">Когда рекомендую более щадящий вариант</span>
        </button>
        <button type="button" onClick="{{ sel2 }}" style="width:100%; text-align:left; background:none; border:0; border-bottom:1px solid rgba(244,244,243,0.1); padding:clamp(13px,1.9vh,20px) 0; display:grid; grid-template-columns:44px minmax(0,1fr); gap:16px; align-items:baseline; cursor:pointer; color:inherit; font:inherit;">
          <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; color:{{ c2 }};">03</span>
          <span style="font-family:'Source Serif 4',Georgia,serif; font-weight:600; text-transform:uppercase; font-size:clamp(15px,1.35vw,23px); line-height:1.16; color:{{ t2 }};">Когда могу отказать в операции</span>
        </button>
        <button type="button" onClick="{{ sel3 }}" style="width:100%; text-align:left; background:none; border:0; border-bottom:1px solid rgba(244,244,243,0.1); padding:clamp(13px,1.9vh,20px) 0; display:grid; grid-template-columns:44px minmax(0,1fr); gap:16px; align-items:baseline; cursor:pointer; color:inherit; font:inherit;">
          <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; color:{{ c3 }};">04</span>
          <span style="font-family:'Source Serif 4',Georgia,serif; font-weight:600; text-transform:uppercase; font-size:clamp(15px,1.35vw,23px); line-height:1.16; color:{{ t3 }};">Почему восстановление проходит у всех по-разному</span>
        </button>
        <button type="button" onClick="{{ sel4 }}" style="width:100%; text-align:left; background:none; border:0; border-bottom:1px solid rgba(244,244,243,0.16); padding:clamp(13px,1.9vh,20px) 0; display:grid; grid-template-columns:44px minmax(0,1fr); gap:16px; align-items:baseline; cursor:pointer; color:inherit; font:inherit;">
          <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; color:{{ c4 }};">05</span>
          <span style="font-family:'Source Serif 4',Georgia,serif; font-weight:600; text-transform:uppercase; font-size:clamp(15px,1.35vw,23px); line-height:1.16; color:{{ t4 }};">Почему сопровождение, часть результата</span>
        </button>
      </div>
    </div>

    <div>
      <div class="ex-preview" style="position:relative; width:100%; height:min(52vh,460px); background:#17171a; overflow:hidden;">
        <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(244,244,243,0.55);">видео · материал готовится</div>
        <div style="position:absolute; left:16px; bottom:14px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(244,244,243,0.62);">{{ num }}</div>
      </div>
      <h3 style="margin:clamp(14px,2vh,22px) 0 0; font-family:'Source Serif 4',Georgia,serif; font-weight:600; font-size:clamp(15px,1.35vw,22px); line-height:1.25; white-space:nowrap;">{{ title }}</h3>
      <p style="margin:clamp(10px,1.5vh,16px) 0 0; font-size:clamp(13px,0.98vw,15px); line-height:1.62; color:rgba(244,244,243,0.72); max-width:42ch; text-wrap:pretty;">{{ text }}</p>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:820}}">
class Component extends DCLogic {
  state = { i: 0 };
  renderVals(){
    const items = [
      { num: '01', title: 'Что я оцениваю на первой консультации', text: 'Анатомию, качество тканей и то, насколько запрос совпадает с тем, что эти ткани удержат.' },
      { num: '02', title: 'Когда рекомендую более щадящий вариант', text: 'Когда меньшее вмешательство даёт результат, который сохранится дольше и будет выглядеть естественнее.' },
      { num: '03', title: 'Когда могу отказать в операции', text: 'Когда риск выше ожидаемой пользы или ожидания не совпадают с тем, что даёт хирургия.' },
      { num: '04', title: 'Почему восстановление проходит у всех по-разному', text: 'Скорость зависит от тканей, образа жизни и исходного состояния — поэтому сроки обсуждаются индивидуально.' },
      { num: '05', title: 'Почему сопровождение, часть результата', text: 'То, как проходят первые недели, влияет на форму не меньше, чем сама операция.' }
    ];
    const i = this.state.i;
    const v = { num: items[i].num, title: items[i].title, text: items[i].text };
    items.forEach((_, n) => {
      v['sel'+n] = () => this.setState({ i: n });
      v['c'+n] = n === i ? '#c69a64' : 'rgba(244,244,243,0.4)';
      v['t'+n] = n === i ? '#f4f4f3' : 'rgba(244,244,243,0.72)';
    });
    return v;
  }
}
</script>
</body>
</html>
