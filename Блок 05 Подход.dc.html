<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; background:#0c0c0d; }
  *{ box-sizing:border-box; }
  body{ -webkit-font-smoothing:antialiased; hyphens:none; }
  a{ color:#f4f4f3; text-decoration:none; }
  a:hover{ color:#ffffff; }
  @media (max-width:900px){
    #approach{ padding:28px 20px 120px !important; min-height:100svh !important; display:block !important; }
    #approach h2 span{ font-size:31px !important; white-space:normal !important; }
    #approach .ap5-type p span{ white-space:normal !important; display:inline !important; }
    #approach .ap5-type p{ font-size:17px !important; }
    .ap5-scene{ position:relative !important; min-height:82svh !important; overflow:visible !important; }
    .ap5-photo{ position:absolute !important; left:-20px !important; right:auto !important; top:auto !important; bottom:-4% !important; width:64% !important; height:58svh !important; z-index:1 !important; }
    .ap5-figure-mount{ position:absolute !important; right:-18% !important; left:auto !important; top:2% !important; width:78% !important; height:74svh !important; z-index:2 !important; opacity:0.95; }
    .ap5-type{ position:relative !important; z-index:3 !important; width:100% !important; margin:0 !important; padding:6svh 0 0 !important; }
    .ap5-type > div:last-child{ margin-top:22px !important; }
  }
  @media (max-width:1000px) and (min-width:901px){
    .ap5-scene{ min-height:auto !important; flex:none !important; }
    #approach{ height:auto !important; min-height:auto !important; display:block !important; padding:clamp(34px,5vh,60px) clamp(22px,5vw,72px) !important; }
    .ap5-photo{ position:relative !important; left:0 !important; top:0 !important; bottom:0 !important; width:100% !important; height:44vh !important; }
    .ap5-figure-mount{ position:relative !important; right:0 !important; top:0 !important; width:100% !important; height:46vh !important; }
    .ap5-type{ width:100% !important; margin:0 !important; padding:clamp(20px,4vh,32px) 0 0 !important; }
  }
</style>
</helmet>

<section id="approach" data-screen-label="05 Подход" style="position:relative; background:#0c0c0d; color:#f4f4f3; font-family:'IBM Plex Sans',-apple-system,sans-serif; min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:clamp(28px,4vh,56px) clamp(22px,5vw,72px);">

  <div style="position:absolute; inset:0; pointer-events:none; background:radial-gradient(80% 70% at 82% 50%, rgba(138,106,60,0.14) 0%, rgba(12,12,13,0) 66%), radial-gradient(60% 55% at 12% 26%, rgba(244,244,243,0.04) 0%, rgba(12,12,13,0) 62%), linear-gradient(180deg, #101011 0%, #0a0a0b 58%, #0d0d0f 100%);"></div>
  <div style="position:absolute; inset:0; pointer-events:none; opacity:0.045; mix-blend-mode:screen; background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>&quot;);"></div>

  <div class="ap5-scene" style="position:relative; flex:1; min-height:0; overflow:hidden;">

    <div class="ap5-photo" style="position:absolute; left:calc(-1 * clamp(22px,5vw,72px)); top:-6%; bottom:-6%; width:46%; z-index:1; -webkit-mask-image:linear-gradient(100deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.9) 34%, rgba(0,0,0,0.42) 66%, rgba(0,0,0,0) 92%), linear-gradient(to bottom, rgba(0,0,0,0) 0%, #000 16%, #000 68%, rgba(0,0,0,0) 99%); -webkit-mask-composite:source-in; mask-image:linear-gradient(100deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.9) 34%, rgba(0,0,0,0.42) 66%, rgba(0,0,0,0) 92%), linear-gradient(to bottom, rgba(0,0,0,0) 0%, #000 16%, #000 68%, rgba(0,0,0,0) 99%); mask-composite:intersect;">
      <img src="assets/philipp-or.png" alt="Филипп Помазков в операционной" style="width:100%; height:100%; object-fit:cover; object-position:64% 34%; display:block; filter:grayscale(0.22) contrast(1.05) brightness(0.92);">
      <div style="position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg, #0c0c0d 0%, #0c0c0d 5%, rgba(12,12,13,0.92) 10%, rgba(12,12,13,0.6) 17%, rgba(12,12,13,0.25) 24%, rgba(12,12,13,0) 32%);"></div>
    </div>

    <div class="ap5-figure-mount" style="position:absolute; right:2%; top:-8%; width:40%; height:116%; z-index:2; -webkit-mask-image:radial-gradient(72% 66% at 50% 50%, #000 52%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0) 100%); mask-image:radial-gradient(72% 66% at 50% 50%, #000 52%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0) 100%);">
      <x-import component-from-global-scope="ap5-figure" from="./ap5-figure.js" hint-size="100%,100%" style="display:block; position:absolute; inset:0; width:100%; height:100%;"></x-import>
    </div>

    <div class="ap5-type" style="position:relative; z-index:3; width:min(38%,500px); margin:0 0 0 32%; padding:clamp(26px,5vh,64px) 0 clamp(18px,3vh,38px);">
      <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(244,244,243,0.6); margin-bottom:clamp(12px,1.8vh,20px);">Подход, в котором важны</div>

      <h2 style="margin:0; font-family:'Source Serif 4',Georgia,serif; text-transform:uppercase; letter-spacing:0.002em;">
        <span style="display:block; font-weight:700; font-size:clamp(26px,3.4vw,54px); line-height:1.02; white-space:nowrap;">Не только форма.</span>
        <span style="display:block; font-weight:400; font-size:clamp(26px,3.4vw,54px); line-height:1.02; color:rgba(244,244,243,0.88); white-space:nowrap;">Чувство меры.</span>
      </h2>

      <div style="margin-top:clamp(22px,3.2vh,38px);">
        <p style="margin:0; font-family:'Source Serif 4',Georgia,serif; font-style:italic; font-weight:400; font-size:clamp(17px,1.6vw,25px); line-height:1.32; color:rgba(244,244,243,0.97);">
          <span style="display:block; white-space:nowrap;">«Мой приоритет - ваша</span>
          <span style="display:block; white-space:nowrap;">удовлетворённость результатом</span>
          <span style="display:block; white-space:nowrap;">и безопасность».</span>
        </p>
        <div style="margin-top:11px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(244,244,243,0.68);">Филипп Помазков</div>
      </div>

      <div style="margin-top:clamp(22px,3.2vh,38px); display:grid; gap:7px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.13em; text-transform:uppercase; color:rgba(244,244,243,0.74);">
        <div>Безопасность прежде эффекта</div>
        <div>Анатомия, а не тренд</div>
        <div>Когда лучше сделать меньше</div>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}"></script>
</body>
</html>
