<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; background:#0e0e10; }
  *{ box-sizing:border-box; }
  body{ -webkit-font-smoothing:antialiased; }
  a{ color:#f4f4f3; text-decoration:none; }
  a:hover{ color:#ffffff; }
  @media (max-width:900px){
    .rev-body{ padding-left:0 !important; }
    .rev-body blockquote div{ white-space:normal !important; text-wrap:pretty; hyphens:none; }
    #review blockquote br{ display:none; }
    .rev-src{ flex-direction:column !important; gap:6px !important; }
  }
</style>
</helmet>

<section id="review" data-screen-label="03 Отзыв пациента" style="position:relative; background:#0e0e10; color:#f4f4f3; font-family:'Source Serif 4',Georgia,serif; min-height:auto; display:flex; flex-direction:column; justify-content:center; padding:clamp(10px,1.6vh,20px) clamp(22px,5vw,72px) clamp(20px,3.2vh,32px);">

  <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(244,244,243,0.58);">отзыв пациента</div>

  <div class="rev-body" style="padding-left:clamp(0px,14vw,240px); max-width:760px; margin:clamp(10px,1.6vh,18px) 0 0;">
  <blockquote style="margin:0;">
    <div style="font-weight:500; font-size:clamp(12px,1.25vw,19px); line-height:1.4; color:rgba(244,244,243,0.62); white-space:nowrap;">В течение реабилитации поддерживал и всегда был на связи.</div>
    <div style="margin-top:clamp(10px,1.4vh,16px); font-weight:700; text-transform:uppercase; font-size:clamp(15px,1.95vw,30px); line-height:1.12; letter-spacing:0.006em; color:#f4f4f3; white-space:nowrap;">Результат выше всяких похвал.</div>
  </blockquote>
    <div style="height:1px; background:rgba(244,244,243,0.09); margin-top:clamp(16px,2.4vh,24px);"></div>
    <div class="rev-src" style="display:flex; align-items:baseline; justify-content:space-between; gap:clamp(16px,4vw,48px); margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(244,244,243,0.58); flex-wrap:wrap;">
      <div>Блефаропластика · отзыв пациента</div>
      <div><a href="https://prodoctorov.ru/" target="_blank" rel="noopener" style="color:rgba(244,244,243,0.58); text-decoration:underline; text-decoration-color:rgba(244,244,243,0.3); text-underline-offset:3px;" style-hover="color:#f4f4f3; text-decoration-color:rgba(244,244,243,0.7);">ПроДокторов</a> · декабрь 2025</div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:760}}"></script>
</body>
</html>
